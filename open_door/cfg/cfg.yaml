## remote
remote_python_path: '/media/datadisk10tb/leo/anaconda3/envs/rm/bin/python'
remote_root_dir: '/media/datadisk10tb/leo/projects/realman-robot/open_door/'
remote_img_dir: '/media/datadisk10tb/leo/projects/realman-robot/open_door/trajectory/remote/'

## primitive
premove:
  offset_in_front: 0.60 # m 0.5
  d2t_coefficient: 4.8
grasp:
  gripper_value: 50
  p1_depth_offset: -0.01 # m
  p2_depth_offset: 0.02 # m 0.06
unlock:
  unlock_v: 5
  gripper_value_before: 500 
  gripper_value_after: 50
rotate:
  rotate_v: 5
  gripper_value: 50
open:
  gripper_value_pull: 50
  gripper_value_push: 50
  T: 4 # s
  linear_velocity: 0.8 # 0.8, >0
  angular_velocity: 0 # 0.6 >0
home:
  gripper_value: 1000
  move_T: 0.5
back:
  gripper_value: 1000
finish:
  gripper_value: 1000
  move_T: 0.5

## threshold
threshold:
  grasp:
    l: -15000
    h: 15000
  unlock:
    l: -18000
    h: 18000
    stop_l_left: -3500 # mainly for joint[2] ## TODO for vertical one 3000?
    stop_h_left: 15000
    stop_l_right: -3000 
    stop_h_right: 15000
  rotate:
    l: -18000
    h: 18000
    stop_l_left: -10000 ## todo
    stop_h_left: 10000 ## todo
    stop_l_right: -3000 ## todo
    stop_h_right: 15000 ## todo
  open:
    l: -25000
    h: 25000
    pull_j3_l_right: -5500 ## todo -4500
    pull_j3_l_left: -1500 ## todo 1000

    push_j3_h_right: 15000
    push_j3_h_left: 4000

## primitive types
pmts:
  home: 0
  premove: 1
  grasp: 2
  unlock: 3
  rotate: 4
  open: 5
  start: 6
  finish: 7
  back: 8
  clear: 9
  teleoperation: 10

## error types
errors:
  success: 1
  current:
    safety_issue: 1024
    event_detected: 2048
    no_issue: 4096
  grasp:
    grasp_safety: 0
    grasp_no_handle: -1
    grasp_ik_fail: -1
    grasp_miss: -1
  rotate:
    rotate_safety: 0
    rotate_miss: -1
    rotate_ik_fail: -1
  unlock:
    unlock_safety: 0
    unlock_miss: -1
    unlock_ik_fail: -1
  open:
    open_safety: 0
    open_miss: -1
    open_fail: -1