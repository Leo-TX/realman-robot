## primitive
premove:
  offset_in_front: 0.60 # m
  d2t_coefficient: 4.8
grasp:
  gripper_value: 50
  p1_x_offset: 0.00
  p2_x_offset: 0.04
unlock:
  unlock_v: 5
  gripper_value_before: 500 
  gripper_value_after: 50
rotate:
  rotate_v: 5
  gripper_value: 50
open:
  gripper_value: 50
  T: 5
  linear_velocity: -0.8
  angular_velocity: -0.6
home:
  gripper_value: 1000
  move_T: 0.5
back:
  gripper_value: 1000
finish:
  gripper_value: 1000
  move_T: 0.5

## threshold
threshold:
  grasp:
    l: -15000
    h: 15000
  unlock:
    l: -18000
    h: 18000
    stop_l: -3000 ## todo
    stop_h: 7500 ## todo
  rotate:
    l: -18000
    h: 18000
    stop_l: -10000 ## todo
    stop_h: 10000 ## todo
  open:
    l: -25000
    h: 25000
    pull_j3_l: -10000
    push_j3_h: 15000

## primitive types
pmts:
  home: 0
  premove: 1
  grasp: 2
  unlock: 3
  rotate: 4
  open: 5
  start: 6
  finish: 7
  back: 8
  clear: 9

